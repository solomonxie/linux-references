# Step 6: docker compose — declaring a multi-container app in one file
# Commands:
#   docker compose up -d
#   docker compose ps
#   docker compose logs api --tail 3
#   docker compose down       # add -v to also remove volumes

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    depends_on:
      - api
  api:
    image: alpine
    command: sh -c "while true; do echo api alive; sleep 5; done"
