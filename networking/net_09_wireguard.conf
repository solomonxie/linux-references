# Step 9: WireGuard — a minimal, modern VPN: one keypair per peer, one UDP
# port, no negotiation state machine like IPsec's (step 10). This is one
# peer's config; the other end needs its own file with left/right swapped.
# Setup:
#   wg genkey | tee privatekey | wg pubkey > publickey   # per peer
#   sudo cp net_09_wireguard.conf /etc/wireguard/wg0.conf
#   sudo wg-quick up wg0
# Inspect: sudo wg show
# Down:    sudo wg-quick down wg0

[Interface]
Address = 10.10.0.1/24                  # this peer's address inside the VPN
ListenPort = 51820
PrivateKey = <this-peer-private-key>    # from `wg genkey`, never shared

[Peer]
PublicKey = <remote-peer-public-key>    # from the other side's `wg pubkey`
Endpoint = vpn.example.com:51820        # omit on a peer with no fixed public address
AllowedIPs = 10.10.0.2/32               # traffic to this range is routed through this peer
PersistentKeepalive = 25                # keeps NAT/firewall state alive when idle
