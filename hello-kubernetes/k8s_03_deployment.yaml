# Step 3: a Deployment — declares a desired number of Pod replicas and
# manages a ReplicaSet to keep that many running, handling rolling
# updates/rollbacks. Use this instead of a bare Pod (step 2) for anything
# long-running.
# Apply:   kubectl apply -f k8s_03_deployment.yaml
# Inspect: kubectl get deployments; kubectl get pods -l app=demo; kubectl rollout status deployment/demo
# Scale:   kubectl scale deployment/demo --replicas=5
# Remove:  kubectl delete -f k8s_03_deployment.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo
spec:
  replicas: 3
  selector:
    matchLabels:
      app: demo
  template:              # a Pod template — same shape as step 2's Pod spec
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: web
          image: nginx:alpine
          ports:
            - containerPort: 80
