# Step 10: Kustomize — patch a base set of manifests for different
# environments (dev/staging/prod) without templating, by declaring
# resources + strategic-merge/JSON patches. Built into kubectl via `-k`.
# Real-world naming note: kubectl only recognizes a file literally named
# `kustomization.yaml` inside the directory passed to `-k` — it's named
# k8s_10_kustomize.yaml here only to keep this series' steps distinct in
# one folder; rename it to kustomization.yaml in its own directory to
# actually run `kubectl apply -k .` against it.

resources:
  - k8s_03_deployment.yaml
  - k8s_04_service.yaml

patches:
  - target:
      kind: Deployment
      name: demo
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 5
