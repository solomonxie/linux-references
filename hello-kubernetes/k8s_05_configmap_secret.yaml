# Step 5: ConfigMap and Secret — injecting configuration and sensitive
# values into Pods without baking them into the image. Same mechanism
# (env vars or mounted files); a Secret is only base64-encoded at rest,
# not actually encrypted — real secrecy needs a cluster add-on (sealed-
# secrets, external-secrets, a KMS provider), not the Secret object alone.
# Prereq: a local cluster with kubectl pointed at it (see step 01/12).
# Apply:   kubectl apply -f k8s_05_configmap_secret.yaml
# Inspect: kubectl get configmap demo-config -o yaml; kubectl get secret demo-secret -o yaml
# Remove:  kubectl delete -f k8s_05_configmap_secret.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-config
data:
  GREETING: "hello from a configmap"
---
apiVersion: v1
kind: Secret
metadata:
  name: demo-secret
type: Opaque
stringData:               # plaintext here; kubectl stores it base64-encoded at rest
  API_TOKEN: "not-a-real-token"
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-config-pod
spec:
  containers:
    - name: app
      image: alpine
      command: ["sh", "-c", "echo $GREETING; echo $API_TOKEN; sleep 3600"]
      envFrom:
        - configMapRef:
            name: demo-config
        - secretRef:
            name: demo-secret
