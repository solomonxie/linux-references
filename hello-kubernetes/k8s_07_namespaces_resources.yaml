# Step 7: namespaces isolate a cluster into virtual sub-clusters (naming,
# RBAC, quotas), and a ResourceQuota caps what a namespace can consume in
# total — complementing the per-container requests/limits from step 2.
# Apply:   kubectl apply -f k8s_07_namespaces_resources.yaml
# Inspect: kubectl get resourcequota -n demo-ns
# Remove:  kubectl delete -f k8s_07_namespaces_resources.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: demo-ns
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: demo-quota
  namespace: demo-ns
spec:
  hard:
    requests.cpu: "1"
    requests.memory: 512Mi
    pods: "10"
