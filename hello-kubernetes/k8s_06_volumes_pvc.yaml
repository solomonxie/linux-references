# Step 6: persistent storage — a PersistentVolumeClaim requests storage
# from whatever StorageClass the cluster provides (a cloud disk, NFS,
# local-path...); a Pod mounts the claim without knowing the backing
# details.
# Apply:   kubectl apply -f k8s_06_volumes_pvc.yaml
# Inspect: kubectl get pvc demo-pvc; kubectl get pv
# Remove:  kubectl delete -f k8s_06_volumes_pvc.yaml

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: demo-pvc
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: demo-pvc-pod
spec:
  containers:
    - name: app
      image: alpine
      command: ["sh", "-c", "echo hello > /data/f.txt; sleep 3600"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: demo-pvc
