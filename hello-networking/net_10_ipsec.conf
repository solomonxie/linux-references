# Step 10: IPsec (via strongSwan) — the traditional/enterprise site-to-site
# VPN standard, negotiated over IKE rather than WireGuard's static keys.
# More moving parts (phase 1/phase 2 security associations, proposals) but
# still the default on a lot of existing enterprise/router gear.
# Setup:    sudo cp net_10_ipsec.conf /etc/ipsec.conf
#           sudo cp net_10_ipsec.secrets /etc/ipsec.secrets && sudo chmod 600 /etc/ipsec.secrets
#           sudo systemctl restart strongswan
# Bring up: sudo ipsec up site-to-site
# Status:   sudo ipsec statusall

config setup
	charondebug="ike 1, knl 1, cfg 1"

conn site-to-site
	type=tunnel
	authby=secret                    # pre-shared key, see ipsec.secrets;
	                                  # certificates are the production-grade alternative
	left=10.0.0.1
	leftsubnet=192.168.1.0/24
	right=10.0.0.2
	rightsubnet=192.168.2.0/24
	ike=aes256-sha256-modp2048!       # phase 1 (IKE SA) proposal
	esp=aes256-sha256!                # phase 2 (IPsec SA) proposal
	auto=start
