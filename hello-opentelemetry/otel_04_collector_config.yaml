# Step 4: the OpenTelemetry Collector -- a standalone process apps send
# OTLP to, sitting between instrumentation and backends so apps don't
# need to know (or change) where telemetry ultimately goes.
# Run:     docker run --rm -p 4317:4317 -p 4318:4318 -p 8889:8889 \
#            -v $(pwd)/otel_04_collector_config.yaml:/etc/otelcol/config.yaml \
#            otel/opentelemetry-collector:latest
# Inspect: curl localhost:8889/metrics   # the prometheus exporter below

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: detailed
  prometheus:                 # Collector re-exposes metrics for scraping --
    endpoint: 0.0.0.0:8889     # see hello-prometheus for the scraping side

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, prometheus]
